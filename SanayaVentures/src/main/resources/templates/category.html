
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${categoryName} + ' | Sanaya Ventures'">Product Category | Sanaya Ventures</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="container content-wrap">
    <div class="breadcrumb">
        <a th:href="@{/}">Home</a> /
        <a th:href="@{/shop}">Shop</a> /
        <span th:text="${categoryName}">Category</span>
    </div>

    <div class="section-heading">
        <span class="eyebrow">Explore our collection</span>
        <h1 class="page-title" th:text="${categoryName}">Category</h1>
        <p class="muted">Explore products selected for this category.</p>
    </div>

    <div class="product-grid" th:if="${products != null and !products.isEmpty()}">
        <article class="product-card" th:each="product : ${products}">
            <a class="product-image" th:href="@{/product/{slug}(slug=${product.slug})}">
                <img th:if="${product.image1 != null and !#strings.isEmpty(product.image1)}"
                     th:src="${product.image1}" th:alt="${product.title}">
                <img th:unless="${product.image1 != null and !#strings.isEmpty(product.image1)}"
                     src="https://placehold.co/600x700/faf7f0/777?text=Product+Image" alt="Product image coming soon">
            </a>
            <div class="product-info">
                <span class="product-category" th:text="${product.category}">Category</span>
                <a th:href="@{/product/{slug}(slug=${product.slug})}">
                    <h3 class="product-title" th:text="${product.title}">Product title</h3>
                </a>
                <div>
                    <span class="price" th:if="${product.price != null}" th:text="'₹' + ${product.price}">₹0</span>
                    <span class="old-price" th:if="${product.mrp != null and product.mrp > 0}" th:text="'₹' + ${product.mrp}">₹0</span>
                </div>
                <div class="product-actions">
                    <a class="btn btn-small btn-outline" th:href="@{/product/{slug}(slug=${product.slug})}">Details</a>
                    <a class="btn btn-small btn-amazon" th:if="${product.amazonLink != null and !#strings.isEmpty(product.amazonLink)}" th:href="${product.amazonLink}" target="_blank" rel="nofollow sponsored noopener">Amazon ↗</a>
                    <a class="btn btn-small btn-flipkart" th:if="${product.flipkartLink != null and !#strings.isEmpty(product.flipkartLink)}" th:href="${product.flipkartLink}" target="_blank" rel="nofollow sponsored noopener">Flipkart ↗</a>
                    <a class="btn btn-small btn-meesho" th:if="${product.meeshoLink != null and !#strings.isEmpty(product.meeshoLink)}" th:href="${product.meeshoLink}" target="_blank" rel="nofollow sponsored noopener">Meesho ↗</a>
                    <a class="btn btn-small btn-myntra" th:if="${product.myntraLink != null and !#strings.isEmpty(product.myntraLink)}" th:href="${product.myntraLink}" target="_blank" rel="nofollow sponsored noopener">Myntra ↗</a>
                </div>
            </div>
        </article>
    </div>

    <div class="empty-state" th:if="${products == null or products.isEmpty()}">
        <h2>No products found in this category</h2>
        <p class="muted">Try another category or explore all products.</p>
        <a th:href="@{/shop}" class="btn btn-gold">Shop All Products</a>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
